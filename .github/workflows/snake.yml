name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch: {}    # manual trigger from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # snake-dark/light match the profile: greyscale grid, one violet accent; the classic pair is kept too
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#161616,#2e2e2e,#525252,#8a8a8a,#d4d4d4
            dist/snake-light.svg?palette=github-light&color_snake=#7c3aed&color_dots=#ebedf0,#d4d4d4,#a3a3a3,#737373,#404040
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # v3 reads the contribution calendar through the GitHub API and needs the token on this step.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes the *contents* of dist/ to the root of the `output` branch,
      # so README URLs are .../output/<file>.svg (no dist/ prefix).
      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
