name: Generate Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 3am UTC — keeps the card fresh without hammering the API
  workflow_dispatch: {}    # manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card as a static SVG
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=BEAST04289&show_icons=true&theme=tokyonight&hide_border=true&count_private=true
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "chore: refresh profile stats card" || exit 0
          git push

# Streak stats and top-languages are broken the same way, for the same reason — same fix applies:
# the dedicated "GitHub Readme Streak Stats Action" (GitHub Marketplace) follows this identical
# pattern for streaks. For top-langs, check this same action's own README for its exact `card:`
# value before wiring it in — that specific parameter wasn't confirmed here, unlike everything above.
