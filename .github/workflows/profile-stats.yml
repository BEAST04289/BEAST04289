name: Profile Stats

# Refreshes the live cards in assets/stats/ and the 3D contribution calendar in profile-3d-contrib/.
# Uses the built-in GITHUB_TOKEN (public data). Optional: add a repository secret STATS_TOKEN
# (classic PAT with read:user) to also count private contributions.

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC (08:47 IST)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/github_stats.py"
      - "scripts/svgkit.py"
      - ".github/profile-3d.json"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Render live stats cards
        continue-on-error: true   # a failed fetch keeps the last good cards instead of breaking the profile
        run: python3 scripts/github_stats.py --user "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Render 3D contribution calendar
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json

      - name: Frame the 3D calendar like the other cards
        continue-on-error: true
        run: python3 scripts/github_stats.py --frame-3d profile-3d-contrib/profile-graphite.svg

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/stats
          if [ -d profile-3d-contrib ]; then git add -A profile-3d-contrib; fi
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore: refresh live profile stats"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
